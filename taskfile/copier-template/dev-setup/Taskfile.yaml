version: '3'

tasks:
  default:
    desc: Bootstrap dev setup
    cmds:
      - task: venv
        vars:
          CLI_ARGS: ""  # Avoid passthrough
      - uv run prek install

  venv:
    desc: Install dev requirements e.g. (task dev-setup:venv -- --locked)
    cmds:
      - uv sync {{.CLI_ARGS}}

  maintenance:
    desc: Project maintenance automation
    cmds:
      - uv run prek auto-update
      - task: maintenance:requirements

  maintenance:requirements:
    vars:
      CLI_ARGS: '{{.CLI_ARGS | default "--upgrade" }}'
    cmds:
      - task: venv
        vars:
          CLI_ARGS: ""  # Avoid passthrough
      - uv lock {{.CLI_ARGS}}
