version: '3'

tasks:
  docker-mount:
    desc: "Example using docker with volumes to test in CI"
    # --user stops the container writing root-owned files into the mounted
    # project dir, which the (non-root) host user then can't modify/delete
    cmds:
      - docker run --rm --user "$(id -u):$(id -g)" -v "$(pwd):/code/" python:3.12-slim cat /code/pyproject.toml
