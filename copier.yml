_min_copier_version: "9.19.1"

_subdirectory: meta_template
_answers_file: .copier-answers.<< template_name >>.yml
_envops:
  block_end_string: "%>"
  block_start_string: "<%"
  comment_end_string: "#>"
  comment_start_string: "<#"
  variable_end_string: ">>"
  variable_start_string: "<<"
  trim_blocks: true
  undefined: jinja2.StrictUndefined  # error loudly for undefined variables
_templates_suffix: .tmpl

template_name:  # Useful for namespacing
  type: str
  default: 'copier-template'
  when: false  # hidden question: reusable variable with default value

template_dir:
  type: str
  default: template
  help: Subdirectory within the repo that will contain the template files (default 'template')

vcs_platform:
  type: str
  help: Which VCS platform would you like CI setup for?
  choices:
    Gitlab: gitlab
    GitHub: github
    None: ""
  default: github

output_template_name:
  type: str
  help: Name of your copier template
  default: your-template-name

template_style:
  type: str
  help: Template delimiter style for the generated template
  choices:
    Jinja: jinja
    Square Brackets: square_brackets
  default: jinja

var_start:
  type: str
  default: "<< '{{' if template_style == 'jinja' else '[[' >>"
  when: false

var_end:
  type: str
  default: "<< '}}' if template_style == 'jinja' else ']]' >>"
  when: false

include_pydantic_validation:
  type: bool
  help: Include support for validation with Pydantic models (and multiline errors)
  default: false

include_template_extensions:
  type: bool
  help: Include support for local extensions
  default: false

include_semantic_release:
  type: bool
  help: Include automated releases with python-semantic-release
  default: true

# Beta: hidden unless opted in with `-d include_actions_lockfile=true`. The
# self-referencing `when` records the answer only for projects that opt in, so
# everyone else is asked fresh when this graduates.
# Not default yet: Renovate's actions.lock support is experimental, and a new
# project's verify workflow fails until `gh actions-lock` is run by hand.
# Revisit when these settle:
# - https://docs.renovatebot.com/modules/manager/github-actions/ (experimental flag)
# - https://github.com/renovatebot/renovate/issues/47052 (lockfile schema sync)
# - https://github.com/github/gh-actions-lock/releases (pre-1.0)
# Known gap: `gh actions-lock` rewrites the template's digest-pinned refs
# (`@<sha> # v7.0.1`) to tags (`@v7.0.1`), so lockfile projects conflict on
# every template change to a `uses:` line.
# To try during the beta: with the "Require actions to be pinned to a
# full-length commit SHA" repo/org policy enabled, Renovate's docs say
# `gh actions-lock` keeps digest refs. If that holds, lockfile projects match
# the template, the policy belongs in the CONTRIBUTING setup steps, and the
# `pinDigests: false` rule in renovate.json.tmpl can go. If not, graduating
# (lockfile by default) is the point to switch the template to tags.
# To graduate: set `when` to `vcs_platform == 'github'` and pick the default.
include_actions_lockfile:
  type: bool
  help: Include a GitHub Actions workflow lockfile check (actions.lock, kept up to date by Renovate)
  default: false
  when: "<< vcs_platform == 'github' and include_actions_lockfile | default(false) >>"
  validator: "<% if include_actions_lockfile and vcs_platform != 'github' %>only supported with GitHub<% endif %>"

# Beta: hidden unless opted in with `-d gitlab_non_root_tests=true`, see the
# `include_actions_lockfile` notes above for how this works.
# Not default yet: unproven on real GitLab runners (the dind TLS certs are
# copied to the test user's ~/.docker, which depends on the runner mounting
# them at DOCKER_TLS_CERTDIR). Graduate once it has run on GitLab pipelines.
# To graduate: set `when` to `vcs_platform == 'gitlab'` and pick the default.
gitlab_non_root_tests:
  type: bool
  help: Run the generated GitLab CI tests as a non-root user, like a developer would locally
  default: false
  when: "<< vcs_platform == 'gitlab' and gitlab_non_root_tests | default(false) >>"
  validator: "<% if gitlab_non_root_tests and vcs_platform != 'gitlab' %>only supported with GitLab<% endif %>"

all_python_versions:
  type: yaml
  default: |
    - '3.10'
    - '3.11'
    - '3.12'
    - '3.13'
    - '3.14'
  when: false

min_python_version:
  type: str
  help: Minimum Python version the generated template's code will support.
  choices: "<< all_python_versions >>"
  default: "<< all_python_versions | first >>"

python_versions:
  type: yaml
  default: "<< all_python_versions[all_python_versions.index(min_python_version):] >>"
  when: false

license_type:
  type: str
  help: License for the generated template (see https://choosealicense.com)
  choices:
    MIT: mit
    Apache 2.0: apache-2.0
    The Unlicense: unlicense
    None: none
  default: mit

license:
  type: bool
  default: "<< license_type != 'none' >>"
  when: false

copyright_year:
  type: str
  default: "<< '%Y' | strftime >>"
  when: "<< license and license_type not in ['none', 'unlicense'] >>"

copyright_name:
  type: str
  placeholder: "Your Name"
  when: "<< license and license_type not in ['none', 'unlicense'] >>"

needs_extensions:
  type: bool
  default: "<< include_pydantic_validation or include_template_extensions >>"
  when: false

needs_trust:
  type: bool
  default: "<< include_pydantic_validation or include_template_extensions >>"
  when: false
