_subdirectory: parent_template
_min_copier_version: "9.6.0"
_answers_file: .copier-answers.<< template_name >>.yml
_envops:
  block_end_string: "%>"
  block_start_string: "<%"
  comment_end_string: "#>"
  comment_start_string: "<#"
  variable_end_string: ">>"
  variable_start_string: "<<"
  trim_blocks: true
_templates_suffix: .tmpl

template_name:
  type: str
  default: 'copier-template'
  when: false  # hidden question

template_dir:
  type: str
  default: template

vcs_platform:
  type: str
  default: gitlab

output_template_name:
  type: str
  default: your-template-name

template_style:
  type: str
  help: Template delimiter style for the generated template
  choices:
    Jinja: jinja
    Square Brackets: square_brackets
  default: jinja

var_start:
  type: str
  default: "<< '{{' if template_style == 'jinja' else '[[' >>"
  when: false

var_end:
  type: str
  default: "<< '}}' if template_style == 'jinja' else ']]' >>"
  when: false
