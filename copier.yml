_envops:
  block_end_string: "%>"
  block_start_string: "<%"
  comment_end_string: "#>"
  comment_start_string: "<#"
  variable_end_string: ">>"
  variable_start_string: "<<"
  trim_blocks: true
  undefined: jinja2.StrictUndefined  # error loudly for undefined variables
_templates_suffix: .tmpl

template_name:
  type: str
  default: 'copier-template'
  when: false  # hidden question

template_dir:
  type: str
  default: template
  help: Subdirectory within the repo that will contain the template files (default 'template')

vcs_platform:
  type: str
  help: Which VCS platform would you like CI setup for?
  choices:
    Gitlab: gitlab
    GitHub: github
    None: ""
  default: github

output_template_name:
  type: str
  help: Name of your copier template
  default: your-template-name

template_style:
  type: str
  help: Template delimiter style for the generated template
  choices:
    Jinja: jinja
    Square Brackets: square_brackets
  default: jinja

var_start:
  type: str
  default: "<< '{{' if template_style == 'jinja' else '[[' >>"
  when: false

var_end:
  type: str
  default: "<< '}}' if template_style == 'jinja' else ']]' >>"
  when: false

include_pydantic_validation:
  type: bool
  help: Include support for validation with Pydantic models (and multiline errors)
  default: false

include_template_extensions:
  type: bool
  help: Include support for local extensions
  default: false

all_python_versions:
  type: yaml
  default: |
    - '3.10'
    - '3.11'
    - '3.12'
    - '3.13'
    - '3.14'
  when: false

min_python_version:
  type: str
  help: Minimum Python version the generated template's code will support.
  choices: "<< all_python_versions >>"
  default: "<< all_python_versions | first >>"

python_versions:
  type: yaml
  default: "<< all_python_versions[all_python_versions.index(min_python_version):] >>"
  when: false

license_type:
  type: str
  help: License for the generated template (see https://choosealicense.com)
  choices:
    MIT: mit
    Apache 2.0: apache-2.0
    The Unlicense: unlicense
    None: none
  default: mit

license:
  type: bool
  default: "<< license_type != 'none' >>"
  when: false

copyright_year:
  type: str
  default: "<< '%Y' | strftime >>"
  when: "<< license and license_type not in ['none', 'unlicense'] >>"

copyright_name:
  type: str
  placeholder: "Your Name"
  when: "<< license and license_type not in ['none', 'unlicense'] >>"

needs_extensions:
  type: bool
  default: "<< include_pydantic_validation or include_template_extensions >>"
  when: false

needs_trust:
  type: bool
  default: "<< include_pydantic_validation or include_template_extensions >>"
  when: false
