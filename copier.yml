_subdirectory: template
_min_copier_version: "9.6.0"
_answers_file: .copier-answers.[[ template_name ]].yml
_envops:
  block_end_string: "%]"
  block_start_string: "[%"
  comment_end_string: "#]"
  comment_start_string: "[#"
  variable_end_string: "]]"
  variable_start_string: "[["
  trim_blocks: true
_skip_if_exists:
  - requirements*.txt  # Don't update pip-compile lock files

template_name:
  type: str
  default: copier-template
  when: false  # hidden question

vcs_platform:
  type: str
  default: gitlab
