include:
  - local: '.gitlab/ci/**/.gitlab-ci.yml'

stages:
  - lint
  - test

tests:
  stage: test
  needs: []
  image: python:3.13-slim@sha256:b19309443a59aa604fd694e04a1698b24df57ab8b7f06a6cd3dcb1769391767e
  services:
    - docker:29.1.2-dind@sha256:40916fb078cdd27640d069bba401324a15a06d3ecbd8895048122c8d321f43f8
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.cache/pre-commit"
    GIT_DEPTH: "0"  # All git tags needed for copier
    # When using dind service, you must instruct Docker to talk with
    # the daemon started inside of the service
    # These are usually specified by the entrypoint, if using the "docker" image
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"  # should be mounded by the gitlab runner
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - apt-get update && apt-get install -y git curl
    - apt-get install --no-install-recommends -y docker-cli
    - python -m venv venv
    - source venv/bin/activate
    - ./scripts/install-task.sh -b /usr/local/bin
    - task dev-setup:virtualenv
  script:
    - task test
  cache:
    - key: tests-pip
      paths:
        - ${PIP_CACHE_DIR}
    - key: tests-pre-commit
      paths:
        - ${PRE_COMMIT_HOME}
