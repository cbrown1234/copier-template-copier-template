pre-commit:
  stage: lint
  needs: []
  image: python:3.14-slim@sha256:9b9a75b908891c42b7af174dcf3f6534ebcedfc28c874c6281eb452e86470e3e
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PREK_HOME: "$CI_PROJECT_DIR/.cache/prek"
  before_script:
    - apt-get update && apt-get install -y git
    - pip install prek
  script:
    - prek run --all-files
  cache:
    - key: pip
      paths:
        - ${PIP_CACHE_DIR}
    - key: prek
      paths:
        - ${PREK_HOME}
