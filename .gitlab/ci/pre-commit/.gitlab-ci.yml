pre-commit:
  stage: lint
  needs: []
  image: python:3.14-slim@sha256:d7a925f9eb9639a93e455b9f12c167569358818c0f62b51b88edbc8fcf34c421
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PREK_HOME: "$CI_PROJECT_DIR/.cache/prek"
  before_script:
    - apt-get update && apt-get install -y git
    - pip install prek
  script:
    - prek run --all-files
  cache:
    - key: pip
      paths:
        - ${PIP_CACHE_DIR}
    - key: prek
      paths:
        - ${PREK_HOME}
