pre-commit:
  stage: lint
  needs: []
  image: python:3.14-slim@sha256:44dd04494ee8f3b538294360e7c4b3acb87c8268e4d0a4828a6500b1eff50061
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PREK_HOME: "$CI_PROJECT_DIR/.cache/prek"
  before_script:
    - apt-get update && apt-get install -y git
    - pip install prek
  script:
    - prek run --all-files
  cache:
    - key: pip
      paths:
        - ${PIP_CACHE_DIR}
    - key: prek
      paths:
        - ${PREK_HOME}
