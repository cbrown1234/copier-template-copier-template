pre-commit:
  stage: lint
  needs: []
  image: python:3.14-slim@sha256:33ef7446e8c14b21cb247e23afbcdc90e98853b70812ca46b2265e769a7dfb8b
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PREK_HOME: "$CI_PROJECT_DIR/.cache/prek"
  before_script:
    - apt-get update && apt-get install -y git
    - pip install prek
  script:
    - prek run --all-files
  cache:
    - key: pip
      paths:
        - ${PIP_CACHE_DIR}
    - key: prek
      paths:
        - ${PREK_HOME}
