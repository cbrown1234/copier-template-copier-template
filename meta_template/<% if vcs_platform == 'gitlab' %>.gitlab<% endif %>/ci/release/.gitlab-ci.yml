---
release:
  stage: release
  image: python:3.14-slim
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - export GITLAB_TOKEN="${GITLAB_TOKEN:-$CI_JOB_TOKEN}"
    - apt-get update && apt-get install -y git
    - pip install uv
    - uv sync --group dev
  script:
    - git checkout -B "$CI_COMMIT_BRANCH" "$CI_COMMIT_SHA"
    - uv run python-semantic-release version
  resource_group: release
